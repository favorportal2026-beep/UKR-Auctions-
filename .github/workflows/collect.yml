name: collect

# Планувальник збору лотів.
#  • Prozorro — ЩОДНЯ 06:00 UTC: короткі приватизаційні/земельні вікна встигаємо
#    застати в активному статусі (тижневий крок міг би їх пропустити). API легкий.
#  • СЕТАМ — раз на тиждень (Пн 07:00 UTC): помісячний CSV важкий і оновлюється
#    рідко, тому щодня його тягнути немає сенсу.
# Разові дозбори/backfill — вручну через "Run workflow" (можна задати джерело).
# (Google Cloud Scheduler + Cloud Run — шлях масштабування, коли зросте обсяг.)
on:
  schedule:
    - cron: '0 6 * * *' # Prozorro — щодня
    - cron: '0 7 * * 1' # СЕТАМ — щотижня (понеділок)
  workflow_dispatch:
    inputs:
      source:
        description: 'Джерело: prozorro | setam | (порожньо = усі)'
        required: false
        default: ''

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Яке джерело збирати: щоденний cron → лише Prozorro; тижневий (Пн) → лише
      # СЕТАМ; ручний запуск → значення input (порожнє = усі джерела).
      - name: Визначити джерело
        id: src
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
              echo "source=setam" >> "$GITHUB_OUTPUT"
            else
              echo "source=prozorro" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "source=${{ github.event.inputs.source }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Збір
        run: |
          if [ -n "${{ steps.src.outputs.source }}" ]; then
            npm run collect -- --source=${{ steps.src.outputs.source }}
          else
            npm run collect
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROZORRO_API_BASE: ${{ secrets.PROZORRO_API_BASE }}
          PROZORRO_START_DATE: ${{ secrets.PROZORRO_START_DATE }}
          SETAM_CSV_URL: ${{ secrets.SETAM_CSV_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
