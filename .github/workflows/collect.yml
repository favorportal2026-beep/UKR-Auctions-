name: collect

# Планувальник збору лотів. Щотижня (понеділок 06:00 UTC), щоб не з'їдати
# спільний ліміт GitHub Actions. Разові дозбори — вручну через "Run workflow".
# (Google Cloud Scheduler + Cloud Run — шлях масштабування, коли зросте обсяг.)
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {} # ручний запуск з вкладки Actions (для backfill/дозбору)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROZORRO_API_BASE: ${{ secrets.PROZORRO_API_BASE }}
          PROZORRO_START_DATE: ${{ secrets.PROZORRO_START_DATE }}
          SETAM_CSV_URL: ${{ secrets.SETAM_CSV_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
